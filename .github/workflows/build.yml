name: Build and Release (Fast Windows)

on:
  push:
    branches: [main, sotc]
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  pull_request:
    paths-ignore:
      - "documents/**"
      - "**/*.md"

  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: write

env:
  BUILD_TYPE: Release

jobs:
  get-info:
    runs-on: ubuntu-24.04
    outputs:
      date: ${{ steps.vars.outputs.date }}
      shorthash: ${{ steps.vars.outputs.shorthash }}
      fullhash: ${{ steps.vars.outputs.fullhash }}
    steps:
    - uses: actions/checkout@v6
    - name: Get date and git hash
      id: vars
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_ENV
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "shorthash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "fullhash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  windows-sdl:
    runs-on: windows-latest
    needs: get-info
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Cache CMake Configuration
      uses: actions/cache@v5
      env:
        cache-name: ${{ runner.os }}-sdl-ninja-cache-cmake-configuration
      with:
        path: |
          ${{github.workspace}}/build
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
        restore-keys: |
          ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
        cache-name: ${{ runner.os }}-sdl-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Package Windows Binary
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "${{github.workspace}}/package" -Force
        Copy-Item "${{github.workspace}}/build/shadPS4.exe" -Destination "${{github.workspace}}/package/"
        Compress-Archive -Path "${{github.workspace}}/package/*" -DestinationPath "${{github.workspace}}/shadps4-win64-sdl-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}.zip"

    - name: Upload Windows SDL artifact
      uses: actions/upload-artifact@v4
      with:
        name: shadps4-win64-sdl-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: ${{github.workspace}}/shadps4-win64-sdl-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}.zip

  pre-release:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/sotc') && github.event_name == 'push'
    needs: [get-info, windows-sdl]
    runs-on: ubuntu-latest
    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: shadps4-win64-sdl-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}
        path: ./artifacts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: "shadPS4 SOTC - ${{ needs.get-info.outputs.date }} (${{ needs.get-info.outputs.shorthash }})"
        tag_name: "release-${{ needs.get-info.outputs.date }}-${{ needs.get-info.outputs.shorthash }}"
        draft: false
        prerelease: false
        generate_release_notes: false
        body: |
          ### Shadow of the Colossus Optimized Build
          - **Commit**: [${{ needs.get-info.outputs.fullhash }}](https://github.com/${{ github.repository }}/commit/${{ needs.get-info.outputs.fullhash }})
          - **Date**: ${{ needs.get-info.outputs.date }}
          - Built automatically with fast Windows runner pipeline.
        files: ./artifacts/*.zip
